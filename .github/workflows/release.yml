name: LOQ Release Automation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.2.7)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish LOQ Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore Signing Keystore & Configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.LOQ_KEYSTORE_BASE64 }}
          STORE_PWD: ${{ secrets.LOQ_STORE_PASSWORD }}
          KEY_PWD: ${{ secrets.LOQ_KEY_PASSWORD }}
          ALIAS: ${{ secrets.LOQ_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > loq-release.jks
          cat <<EOF > local.properties
          STORE_PASSWORD=$STORE_PWD
          KEY_PASSWORD=$KEY_PWD
          KEY_ALIAS=$ALIAS
          KEYSTORE_PATH=loq-release.jks
          EOF

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Universal FOSS Release
        run: ./gradlew :app:assembleUniversalFossRelease --no-daemon -Djava.awt.headless=true

      - name: Prepare Release Artifacts & Checksums
        run: |
          mkdir -p dist
          APK_PATH=$(find app/build/outputs/apk/universalFoss/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk -name "*universal*release*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" dist/LOQ-universal-foss-release.apk

          cd dist
          sha256sum LOQ-universal-foss-release.apk > LOQ-universal-foss-release.apk.sha256
          echo "SHA-256 Checksum:"
          cat LOQ-universal-foss-release.apk.sha256
          cd ..

      - name: Verify APK Signature
        run: |
          ANDROID_BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$ANDROID_BUILD_TOOLS/apksigner" verify --verbose dist/LOQ-universal-foss-release.apk

      - name: Determine Tag and Release Notes
        id: release_meta
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: "LOQ ${{ steps.release_meta.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/LOQ-universal-foss-release.apk
            dist/LOQ-universal-foss-release.apk.sha256

